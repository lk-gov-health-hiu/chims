<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

    <body>

        <ui:composition template="./template.xhtml">

            <ui:define name="content">

                <div class="cm-page-title">
                    <div>
                        <div class="cm-page-title-text">
                            User Profile
                        </div>
                        <div class="cm-page-sub">
                            Manage your account settings and personal preferences.
                        </div>
                    </div>
                </div>

                <h:form id="profileForm">
                    <div class="profile-container">
                        
                        <!-- Sidebar: Profile Overview -->
                        <div class="profile-sidebar">
                            <div class="profile-card-static">
                                <div class="profile-avatar-wrap">
                                    <i class="bi bi-person-fill" />
                                </div>
                                <div class="profile-name">
                                    <h:outputText value="#{webUserController.loggedUser.name}" />
                                </div>
                                <div class="profile-role">
                                    <h:outputText value="#{webUserController.loggedUser.webUserRole}" />
                                </div>
                                
                                <div class="profile-stats">
                                    <div class="profile-stat-item">
                                        <span class="profile-stat-value">Active</span>
                                        <span class="profile-stat-label">Status</span>
                                    </div>
                                    <div class="profile-stat-item">
                                        <span class="profile-stat-value">
                                            <h:outputText value="#{webUserController.loggedUser.defLocale}">
                                                <f:converter converterId="javax.faces.Character" rendered="false"/>
                                            </h:outputText>
                                        </span>
                                        <span class="profile-stat-label">Lang</span>
                                    </div>
                                </div>

                                <div class="mt-4 text-start">
                                    <p:button outcome="/change_my_password" 
                                              value="Security Settings" 
                                              icon="bi bi-shield-lock"
                                              styleClass="ui-button-outlined ui-button-secondary w-100" />
                                </div>
                            </div>
                        </div>

                        <!-- Main Content: Editable Details -->
                        <div class="profile-main">
                            
                            <!-- Personal Details Card -->
                            <div class="cm-card-modern">
                                <div class="cm-card-head">
                                    <span class="cm-card-title">
                                        <i class="bi bi-person-lines-fill" style="color: var(--cm-primary); margin-right: 0.5rem;"/> 
                                        Account Details
                                    </span>
                                </div>
                                <div class="cm-card-body">
                                    <div class="row g-4">
                                        <div class="col-md-12">
                                            <p:outputLabel value="Display Name" for="displayName" class="form-label d-block mb-1" />
                                            <p:inputText id="displayName" class="form-control"
                                                         value="#{webUserController.selected.person.name}" 
                                                         placeholder="Enter your full name" />
                                        </div>

                                        <div class="col-md-6">
                                            <p:outputLabel value="Username" for="uname" class="form-label d-block mb-1" />
                                            <p:inputText id="uname" class="form-control" disabled="true"
                                                         value="#{webUserController.selected.name}" 
                                                         style="background: #f8f8f8;" />
                                            <small class="text-muted">Username cannot be changed.</small>
                                        </div>

                                        <div class="col-md-6">
                                            <p:outputLabel value="Email Address" for="email" class="form-label d-block mb-1" />
                                            <p:inputText id="email" class="form-control"
                                                         value="#{webUserController.selected.email}" 
                                                         placeholder="example@email.com" />
                                        </div>

                                        <div class="col-md-6">
                                            <p:outputLabel value="Contact Number" for="phone" class="form-label d-block mb-1" />
                                            <p:inputText id="phone" class="form-control"
                                                         value="#{webUserController.selected.telNo}" 
                                                         placeholder="+94 7X XXX XXXX" />
                                        </div>

                                        <div class="col-md-6">
                                            <p:outputLabel value="System Language" for="lang" class="form-label d-block mb-1" />
                                            <p:selectOneMenu id="lang" value="#{webUserController.selected.defLocale}" class="form-control w-100">
                                                <f:selectItem itemLabel="English" itemValue="en" />
                                                <f:selectItem itemLabel="Sinhala" itemValue="si" />
                                                <f:selectItem itemLabel="Tamil" itemValue="ta" />
                                            </p:selectOneMenu>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Professional Details Card -->
                            <div class="cm-card-modern">
                                <div class="cm-card-head">
                                    <span class="cm-card-title">
                                        <i class="bi bi-building" style="color: var(--cm-primary); margin-right: 0.5rem;"/> 
                                        Work Information
                                    </span>
                                </div>
                                <div class="cm-card-body">
                                    <div class="row g-4">
                                        <div class="col-md-6">
                                            <p:outputLabel value="Assigned Institution" class="form-label d-block mb-1" />
                                            <h:outputText value="#{webUserController.selected.institution.name}" 
                                                          styleClass="form-control-plaintext fw-bold" />
                                        </div>
                                        <div class="col-md-6">
                                            <p:outputLabel value="Institutional Level" class="form-label d-block mb-1" />
                                            <h:outputText value="#{webUserController.selected.institution.institutionType}" 
                                                          styleClass="form-control-plaintext fw-bold" />
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Action Bar -->
                            <div class="d-flex justify-content-end gap-2 mt-4">
                                <p:button outcome="/index" value="Discard Changes" 
                                          styleClass="ui-button-flat ui-button-secondary" />
                                <p:commandButton ajax="false" 
                                                 action="#{webUserController.updateMyDetails()}" 
                                                 value="Save Profile Settings" 
                                                 icon="bi bi-save"
                                                 styleClass="ui-button-primary shadow-sm" />
                            </div>

                        </div>
                    </div>
                </h:form>

            </ui:define>

        </ui:composition>

    </body>
</html>
