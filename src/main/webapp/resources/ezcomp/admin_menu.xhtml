<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:cc="http://xmlns.jcp.org/jsf/composite"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui">

    <cc:interface>
    </cc:interface>

    <cc:implementation>
        <!-- GitHub-style top header bar -->
        <div class="chims-header">
            <div class="chims-header-inner">
                <!-- Brand / Logo — always routes to dashboard via JSF view handler -->
                <h:link outcome="/index" styleClass="chims-brand">
                    <h:graphicImage library="image" name="chims_logo_login.png"
                                    styleClass="chims-logo-img" alt="cHIMS" />
                    <span class="chims-brand-text">
                        <span class="chims-brand-c">c</span><span class="chims-brand-hims">HIMS</span>
                    </span>
                </h:link>

                <!-- Right side actions -->
                <div class="chims-header-actions">
                    <h:form styleClass="chims-search-form">
                        <p:inputText autocomplete="off"
                                     placeholder="&#xF52A; Search by ID / PHN / Passport"
                                     styleClass="chims-search-input"
                                     value="#{clientController.searchingId}" />
                        <p:commandButton ajax="false"
                                         icon="bi bi-search"
                                         styleClass="chims-icon-btn chims-icon-btn--primary"
                                         title="Search"
                                         action="#{clientController.searchByAnyId()}" />
                    </h:form>

                    <!-- User greeting -->
                    <span class="chims-user-chip" rendered="#{webUserController.loggedUser ne null}">
                        <i class="bi bi-person-circle" />
                        <h:outputText value="#{webUserController.loggedUser.name}" />
                    </span>

                    <!-- Logout -->
                    <h:form styleClass="chims-logout-form">
                        <p:commandButton action="#{webUserController.logOut()}"
                                         ajax="false"
                                         icon="bi bi-box-arrow-right"
                                         styleClass="chims-icon-btn chims-icon-btn--danger"
                                         rendered="#{webUserController.loggedUser ne null}"
                                         title="Sign out" />
                    </h:form>
                </div>
            </div>
        </div>

        <!-- Navigation menu bar -->
        <div class="chims-navbar-wrap">
            <h:form styleClass="chims-nav-form">
                <p:menubar rendered="#{webUserController.loggedUser ne null}" autoDisplay="true" styleClass="chims-menubar">
                    <p:menuitem ajax="false" value="Home"
                                icon="bi bi-house-door-fill cm-icon-chip"
                                action="/index" />

                    <p:submenu label="Clients"
                               icon="bi bi-heart-pulse-fill cm-icon-chip"
                               rendered="#{webUserController.hasPrivilege('Client_Management')}">
                        <p:menuitem ajax="false" value="Register New"
                                    icon="bi bi-person-plus-fill cm-icon-chip"
                                    action="#{clientController.toAddNewClient()}" />
                        <p:menuitem ajax="false" value="Reserve PHN"
                                    icon="bi bi-person-vcard-fill cm-icon-chip"
                                    action="#{clientController.toReserverPhn()}" />
                        <p:menuitem ajax="false" value="List of Patients"
                                    icon="bi bi-people-fill cm-icon-chip"
                                    action="#{clientController.toListOfPatients()}" />
                    </p:submenu>

                    <p:submenu label="Analysis"
                               icon="bi bi-bar-chart-line-fill cm-icon-chip">
                        <p:menuitem ajax="false" value="Queries"
                                    icon="bi bi-funnel-fill cm-icon-chip"
                                    action="#{queryComponentController.toQueryIndex()}" />
                        <p:menuitem ajax="false" value="Reports"
                                    icon="bi bi-bar-chart-fill cm-icon-chip"
                                    action="#{reportController.toViewReports()}" />
                        <p:menuitem ajax="false" value="Counts"
                                    icon="bi bi-list-ol cm-icon-chip"
                                    action="#{nationalReportController.toNationalReportsCounts()}" />
                        <p:menuitem ajax="false" value="Indicators"
                                    icon="bi bi-graph-up-arrow cm-icon-chip"
                                    action="#{indicatorController.toIndicatorIndex}" />
                    </p:submenu>

                    <p:submenu label="Institution Admin"
                               icon="bi bi-bank2 cm-icon-chip"
                               rendered="#{webUserController.hasPrivilege('Institution_Administration')}">
                        <p:menuitem value="Manage Users"
                                    icon="bi bi-people-fill cm-icon-chip"
                                    action="/insAdmin/user_index" ajax="false" />
                        <p:menuitem value="Manage Institutions"
                                    icon="bi bi-buildings cm-icon-chip"
                                    action="/insAdmin/institution_index" />
                        <p:menuitem value="Manage Areas"
                                    icon="bi bi-geo-alt-fill cm-icon-chip"
                                    action="/insAdmin/area_index" ajax="false" />
                        <p:menuitem value="Manage Metadata"
                                    icon="bi bi-tags-fill cm-icon-chip"
                                    action="/insAdmin/data_index" ajax="false" />
                    </p:submenu>

                    <p:submenu label="System Admin"
                               icon="bi bi-shield-shaded cm-icon-chip"
                               rendered="#{webUserController.hasPrivilege('System_Administration')}">
                        <p:menuitem value="Manage Users"
                                    icon="bi bi-people-fill cm-icon-chip"
                                    action="#{webUserController.toManageUserIndexForSystemAdmin()}" ajax="false" />
                        <p:menuitem value="Manage Institutions"
                                    icon="bi bi-buildings cm-icon-chip"
                                    action="/institution/index" ajax="false" />
                        <p:menuitem value="Manage Areas"
                                    icon="bi bi-geo-alt-fill cm-icon-chip"
                                    action="/area/index" ajax="false" />
                        <p:menuitem value="Manage Metadata"
                                    icon="bi bi-tags-fill cm-icon-chip"
                                    action="/systemAdmin/manage_metadata_index" ajax="false" />
                        <p:menuitem value="Manage Data"
                                    icon="bi bi-database-fill-gear cm-icon-chip"
                                    action="/systemAdmin/manage_data_index" ajax="false" />
                        <p:menuitem value="Manage Interfaces"
                                    icon="bi bi-diagram-3-fill cm-icon-chip"
                                    action="/systemAdmin/integration_index" ajax="false" />
                        <p:menuitem value="Manage Analysis"
                                    icon="bi bi-clipboard-data-fill cm-icon-chip"
                                    action="/queryComponent/index" ajax="false" />
                        <p:menuitem value="Preferences"
                                    icon="bi bi-sliders2 cm-icon-chip"
                                    action="#{preferenceController.toManagePreferences()}" ajax="false" />
                    </p:submenu>

                    <p:submenu label="Settings"
                               icon="bi bi-gear-fill cm-icon-chip">
                        <p:menuitem value="Change Password"
                                    icon="bi bi-shield-lock-fill cm-icon-chip"
                                    action="#{webUserController.toChangeMyPassword()}" ajax="false" />
                        <p:menuitem value="My Details"
                                    icon="bi bi-person-badge-fill cm-icon-chip"
                                    action="#{webUserController.toChangeMyDetails()}" ajax="false" />
                        <p:menuitem value="API Keys"
                                    icon="bi bi-key-fill cm-icon-chip"
                                    action="#{apiKeyController.toManageMyApiKeys()}" ajax="false" />
                    </p:submenu>

                    <p:submenu label="Help"
                               icon="bi bi-question-circle-fill cm-icon-chip">
                        <p:menuitem value="User Manual (Sinhala)"
                                    icon="bi bi-book-half cm-icon-chip"
                                    outcome="/wikis" />
                        <p:menuitem value="User Manual (Tamil)"
                                    icon="bi bi-book-half cm-icon-chip"
                                    outcome="/wikit" />
                        <p:menuitem value="User Manual (English)"
                                    icon="bi bi-book-half cm-icon-chip"
                                    outcome="/wiki" />
                        <p:menuitem value="Issue Tracker"
                                    icon="bi bi-github cm-icon-chip"
                                    url="https://github.com/lk-gov-health-hiu/pssp/issues"
                                    ajax="false" target="_blank" />
                        <p:menuitem value="Troubleshooting"
                                    icon="bi bi-tools cm-icon-chip"
                                    outcome="/troubleschooter" />
                        <p:menuitem value="About"
                                    icon="bi bi-info-circle-fill cm-icon-chip"
                                    outcome="/about_us" />
                    </p:submenu>
                </p:menubar>
            </h:form>
        </div>
    </cc:implementation>
</html>
