<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:cc="http://xmlns.jcp.org/jsf/composite"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

    <cc:interface>
    </cc:interface>

    <cc:implementation>
        <h:outputStylesheet library="css" name="login.css" />

        <div class="login-wrapper">
            <div class="login-box">

                <!-- Logo + title header (logo swaps with theme) -->
                <div class="login-header">
                    <h:graphicImage library="image" name="chims_logo_login.png"
                                    styleClass="app-logo app-logo-light" alt="cHIMS logo" />
                    <h:graphicImage library="image" name="chims_logo_login_dark.png"
                                    styleClass="app-logo app-logo-dark" alt="cHIMS logo" />
                    <h1>Sign in to cHIMS</h1>
                </div>

                <!-- Login form card -->
                <div class="login-card">
                    <h:form>
                        <p:defaultCommand target="signinBtn" />
                        <div class="mb-3">
                            <label class="form-label" for="txtUserName">Username</label>
                            <p:inputText id="txtUserName"
                                         required="true"
                                         styleClass="w-100"
                                         requiredMessage="Enter a username"
                                         autocomplete="off"
                                         value="#{webUserController.userName}" />
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="pwd">Password</label>
                            <p:password id="pwd"
                                        toggleMask="true"
                                        value="#{webUserController.password}"
                                        styleClass="w-100"
                                        required="true"
                                        requiredMessage="Enter a password" />
                        </div>

                        <div class="mb-2">
                            <p:commandButton id="signinBtn"
                                             styleClass="btn-signin"
                                             value="Sign in"
                                             ajax="false"
                                             action="#{webUserController.login()}" />
                        </div>

                        <h:panelGroup rendered="#{not webUserController.thereAreUsersInTheSystem()}">
                            <hr style="border-color:#d0d7de; margin: 1rem 0;" />
                            <p style="font-size:0.8125rem; color:#57606a; text-align:center; margin-bottom:0.5rem;">
                                No users found. Fresh installation?
                            </p>
                            <p:commandButton styleClass="btn-setup"
                                             value="First Time Setup"
                                             ajax="false"
                                             action="#{webUserController.toSetupFirstAdmin()}" />
                        </h:panelGroup>
                    </h:form>
                </div>

                <!-- Info footer -->
                <div class="login-footer-box">
                    <div class="login-gov-row">
                        <a href="https://www.health.gov.lk/" target="_blank" class="login-emblem-link">
                            <h:graphicImage library="image" name="sl_gov_emblem.svg"
                                            styleClass="login-sl-emblem" alt="Sri Lanka Government Emblem" />
                        </a>
                        <div class="login-gov-text">
                            <a href="https://www.health.gov.lk/" target="_blank" class="login-moh-name">Ministry of Health</a>
                            <span class="login-gov-country">Sri Lanka</span>
                            <div class="login-gov-divider" />
                            <div class="login-gov-chims">
                                <span class="brand-name">cHIMS</span> — Cloud Health Information Management System
                            </div>
                            <div class="login-gov-unit">Health Information Unit</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </cc:implementation>
</html>
