<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://java.sun.com/jsf/facelets"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

    <h:body>

        <ui:composition template="/webUser/index.xhtml">

            <ui:define name="webUserContents">
                <div class="cm-page-title">
                    <div>
                        <div class="cm-page-title-text">
                            Manage Users
                        </div>
                        <div class="cm-page-sub">
                            View and edit system users, manage their privileges, and reset passwords.
                        </div>
                    </div>
                </div>

                <h:form >
                    <div class="cm-card-modern">
                        <div class="cm-card-head d-flex justify-content-between align-items-center">
                            <span class="cm-card-title">
                                <i class="bi bi-people-fill" style="color: var(--cm-primary); margin-right: 0.5rem;"/> 
                                User List
                            </span>
                            <div class="d-flex gap-2">
                                <p:commandButton value="Export to Excel" ajax="false" icon="bi bi-file-earmark-excel"
                                                 styleClass="ui-button-outlined ui-button-success">
                                    <p:dataExporter target="datalist" type="xls" fileName="users" ></p:dataExporter>
                                </p:commandButton>
                                <p:commandButton ajax="false" value="Back" action="#{webUserController.toManageUserIndexForSystemAdmin()}" 
                                                 icon="bi bi-arrow-left" styleClass="ui-button-flat ui-button-secondary"/>
                            </div>
                        </div>
                        <div class="cm-card-body">
                            <p:dataTable value="#{webUserController.items}" var="item"  
                                         id="datalist"
                                         rowKey="#{item.id}" 
                                         selection="#{webUserController.current}" 
                                         rows="15"
                                         paginator="true"
                                         paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                                         rowsPerPageTemplate="15,30,50"
                                         styleClass="cm-data-table"
                                         >

                                <p:column sortBy="#{item.person.name}" filterBy="#{item.person.name}" filterMatchMode="contains">
                                    <f:facet name="header">
                                        <h:outputText value="Name"/>
                                    </f:facet>
                                    <h:outputText value="#{item.person.name}"/>
                                </p:column>

                                <p:column width="120" sortBy="#{item.name}" filterBy="#{item.name}" filterMatchMode="contains">
                                    <f:facet name="header">
                                        <h:outputText value="Username"/>
                                    </f:facet>
                                    <h:outputText value="#{item.name}" styleClass="fw-bold text-primary" />
                                </p:column>

                                <p:column sortBy="#{item.institution.name}" filterBy="#{item.institution.name}" filterMatchMode="contains">
                                    <f:facet name="header">
                                        <h:outputText value="Institution"/>
                                    </f:facet>
                                    <h:outputText value="#{item.institution.name}"/>
                                </p:column>
                                
                                <p:column width="130" sortBy="#{item.telNo}" filterBy="#{item.telNo}" filterMatchMode="contains">
                                    <f:facet name="header">
                                        <h:outputText value="Phone"/>
                                    </f:facet>
                                    <h:outputText value="#{item.telNo}"/>
                                </p:column>

                                <p:column width="150" sortBy="#{item.webUserRole}" filterBy="#{item.webUserRole}" filterMatchMode="contains">
                                    <f:facet name="header">
                                        <h:outputText value="Role"/>
                                    </f:facet>
                                    <span class="badge bg-light text-dark">
                                        <h:outputText value="#{item.webUserRole.label}"/>
                                    </span>
                                </p:column>

                                <p:column width="200" headerText="Actions" exportable="false">
                                    <div class="d-flex flex-wrap gap-1">
                                        <p:commandButton icon="bi bi-pencil" ajax="false"
                                                         title="Edit User"
                                                         styleClass="ui-button-sm ui-button-info"
                                                         action="#{webUserController.prepareEdit()}" >
                                            <f:setPropertyActionListener value="#{item}" target="#{webUserController.current}" ></f:setPropertyActionListener>
                                        </p:commandButton>
                                        <p:commandButton icon="bi bi-shield-check" ajax="false"
                                                         title="Manage Privileges"
                                                         styleClass="ui-button-sm ui-button-warning"
                                                         action="#{webUserController.toManagePrivileges()}" >
                                            <f:setPropertyActionListener value="#{item}" 
                                                                         target="#{webUserController.current}" >
                                            </f:setPropertyActionListener>
                                        </p:commandButton>
                                        <p:commandButton icon="bi bi-key" ajax="false"
                                                         title="Reset Password"
                                                         styleClass="ui-button-sm ui-button-help"
                                                         action="#{webUserController.prepareEditPassword()}" >
                                            <f:setPropertyActionListener value="#{item}" target="#{webUserController.current}" ></f:setPropertyActionListener>
                                        </p:commandButton>
                                        <p:commandButton icon="bi bi-trash" ajax="false"
                                                         title="Delete User"
                                                         styleClass="ui-button-sm ui-button-danger"
                                                         action="#{webUserController.deleteUser()}" 
                                                         onclick="return confirm('Are you sure you want to delete this user?');">
                                            <f:setPropertyActionListener value="#{item}" target="#{webUserController.current}" ></f:setPropertyActionListener>
                                        </p:commandButton>
                                    </div>
                                </p:column>
                            </p:dataTable>
                        </div>
                    </div>
                </h:form>
                <br/>
                <br/>

            </ui:define>
        </ui:composition>

    </h:body>
</html>
