<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <body>

 <ui:composition template="/webUser/index.xhtml">

            <ui:define name="webUserContents">

                <p:panel id="WebUserPasswordDlg" header="Change User Password" styleClass="cm-form-panel">
                    <h:form id="WebUserPasswordForm">

                        <p:panelGrid columns="2" rendered="#{webUserController.selected != null}" styleClass="cm-form-grid" style="width: 100%; max-width: 600px;">
                            <f:facet name="header" >
                                <p:commandButton action="#{webUserController.updatePassword()}" value="Update Password" ajax="false" styleClass="m-1" />
                                <p:commandButton value="Back" action="#{webUserController.toManageUserIndexForSystemAdmin()}" ajax="false" styleClass="m-1" />
                            </f:facet>

                            <p:outputLabel value="Username" for="username" styleClass="cm-form-label" />
                            <p:inputText  id="username" value="#{webUserController.selected.name}" 
                                          readonly="true" styleClass="cm-form-field" />


                            <p:outputLabel value="New Password" for="password" styleClass="cm-form-label" />
                            <p:password id="password" value="#{webUserController.passwordReenter}" 
                                        feedback="true" styleClass="cm-form-field" required="true" />

                            <p:outputLabel value="Re-enter New Password" for="passwordReenter" styleClass="cm-form-label" />
                            <p:password id="passwordReenter" value="#{webUserController.password}" 
                                        styleClass="cm-form-field" required="true" />

                        </p:panelGrid>

                    </h:form>
                </p:panel>


            </ui:define>

        </ui:composition>

    </body>
</html>
