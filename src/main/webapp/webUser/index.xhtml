<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"

      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">


    <h:head>
        <h:outputStylesheet library="css" name="main.css" ></h:outputStylesheet>
    </h:head>

    <h:body>
        <ui:composition template="/template.xhtml">
            <ui:define name="content">
                <p:panel style="height: 100%; text-align: center;" rendered="#{!webUserController.loggedUser.systemAdministrator}">
                    <h1>You are NOT authorized</h1>
                </p:panel>

                <div class="container-fluid">
                    <div class="row">
                        <div class="col-md-3">
                            <h:form>
                                <div class="cm-card-modern shadow-sm border-0">
                                    <div class="cm-card-head py-3 px-3">
                                        <span class="cm-card-title fs-6 fw-bold">
                                            <i class="bi bi-gear-fill me-2" style="color: var(--cm-primary);"/> 
                                            User Management
                                        </span>
                                    </div>
                                    <div class="cm-card-body p-0">
                                        <p:menu toggleable="true" style="width: 100%; border: none; background: transparent;">
                                            <p:menuitem value="Add New User" icon="bi bi-person-plus" 
                                                        action="#{webUserController.toCreateNewUserBySysAdmin()}" ajax="false" />
                                            <p:menuitem value="View Users" icon="bi bi-people" 
                                                        action="#{webUserController.toManageAllUsers()}" ajax="false" />
                                            <p:menuitem value="View Transactions" icon="bi bi-clock-history" 
                                                        action="#{userTransactionController.toSearchUserTransactions()}" ajax="false" />
                                            <p:menuitem value="Demo Accounts" icon="bi bi-person-badge" 
                                                        action="/demoAccount/List" ajax="false" />
                                            <p:menuitem value="Suspicious Logins" icon="bi bi-exclamation-triangle" 
                                                        action="#{userTransactionController.toSuspiciousLoginAttempts()}" ajax="false" />
                                        </p:menu>
                                    </div>
                                </div>
                            </h:form>
                        </div>
                        <div class="col-md-9 mt-4 mt-md-0">
                            <ui:insert name="webUserContents" />
                        </div>
                    </div>
                </div>

            </ui:define>

        </ui:composition>

    </h:body>
</html>
