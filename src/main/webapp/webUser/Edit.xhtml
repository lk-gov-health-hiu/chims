<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://java.sun.com/jsf/facelets"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

    <body>

 <ui:composition template="/webUser/index.xhtml">

            <ui:define name="webUserContents">
                <p:panel id="WebUserEditDlg" header="Edit User Details" styleClass="cm-form-panel">
                    <h:form id="WebUserEditForm">

                        <p:panelGrid columns="4" rendered="#{webUserController.selected != null}" styleClass="cm-form-grid" style="width: 100%;">
                            <f:facet name="header" >
                                <p:commandButton action="#{webUserController.update}" value="#{bundleClinical.Save}" ajax="false" styleClass="m-1" />
                                <p:commandButton value="Back" action="#{webUserController.toManageUserIndexForSystemAdmin()}" ajax="false" styleClass="m-1" />
                            </f:facet>

                            <p:outputLabel value="Username" for="username" styleClass="cm-form-label" />
                            <p:inputText  id="username" value="#{webUserController.selected.name}" title="#{bundleClinical.EditWebUserTitle_name}"
                                          readonly="true" required="true" requiredMessage="#{bundleClinical.EditWebUserRequiredMessage_name}"
                                          styleClass="cm-form-field" />


                            <p:outputLabel value="Title" for="title" styleClass="cm-form-label" />
                            <p:selectOneMenu id="title"  value="#{webUserController.selected.person.title}" styleClass="cm-form-field" >
                                <f:selectItems value="#{itemController.titles}" var="t" itemLabel="#{t.name}"
                                               itemValue="#{t}" ></f:selectItems>
                            </p:selectOneMenu>

                            <p:outputLabel value="Name" for="name" styleClass="cm-form-label" />
                            <p:inputText 
                                autocomplete="off" 
                                id="name" 
                                value="#{webUserController.selected.person.name}"
                                title="Name" 
                                styleClass="cm-form-field" />


                            <p:outputLabel value="Institution" for="institution" styleClass="cm-form-label" />
                            <p:autoComplete  id="institution" value="#{webUserController.selected.institution}" 
                                             completeMethod="#{institutionController.completeInstitutions}"
                                     var="i" itemLabel="#{i.name}" itemValue="#{i}"
                                     forceSelection="true" maxResults="15" minQueryLength="3"
                                     styleClass="cm-form-field">
                            </p:autoComplete >

                            <p:outputLabel value="Email" for="email" styleClass="cm-form-label" />
                            <p:inputText id="email" value="#{webUserController.selected.email}" title="#{bundleClinical.EditWebUserTitle_email}" styleClass="cm-form-field" />

                            <p:outputLabel value="Telephone No." for="telNo" styleClass="cm-form-label" />
                            <p:inputText id="telNo" value="#{webUserController.selected.telNo}" title="#{bundleClinical.EditWebUserTitle_telNo}" styleClass="cm-form-field" />


                            <p:outputLabel value="Role" for="webUserRole" styleClass="cm-form-label" />
                            <p:selectOneMenu  id="webUserRole" value="#{webUserController.selected.webUserRole}" styleClass="cm-form-field" >
                        <f:selectItems value="#{applicationController.webUserRoles}" 
                                       var="webUserRoles" 
                                       itemLabel="#{webUserRoles.label}" 
                                       itemValue="#{webUserRoles}">
                        </f:selectItems>
                            </p:selectOneMenu>

                        </p:panelGrid>


                    </h:form>
                </p:panel>

            </ui:define>
        </ui:composition>

    </body>
</html>
