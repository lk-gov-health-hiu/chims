<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://java.sun.com/jsf/facelets"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

    <body>

        <ui:composition template="/template.xhtml">

            <ui:define name="content">
                <p:panel id="WebUserEditDlg" header="Edit My Details" styleClass="cm-form-panel">
                    <h:form id="WebUserEditForm">

                        <p:panelGrid columns="4" rendered="#{webUserController.loggedUser != null}" styleClass="cm-form-grid" style="width: 100%;">
                            <f:facet name="header" >
                                <p:commandButton actionListener="#{webUserController.updateMyDetails()}" value="#{bundleClinical.Save}" styleClass="m-1" />
                                <p:commandButton value="Back" action="index" styleClass="m-1" />
                            </f:facet>


                            <p:outputLabel value="Username" for="username" styleClass="cm-form-label" />
                            <p:inputText  id="username" value="#{webUserController.loggedUser.name}" title="#{bundleClinical.EditWebUserTitle_name}"
                                          readonly="true" required="true" requiredMessage="#{bundleClinical.EditWebUserRequiredMessage_name}"
                                          styleClass="cm-form-field" />


                            <p:outputLabel value="Title" for="title" styleClass="cm-form-label" />
                            <p:selectOneMenu id="title"  value="#{webUserController.loggedUser.person.title}" styleClass="cm-form-field" >
                                <f:selectItems value="#{itemController.titles}" var="t" itemLabel="#{t.name}"
                                               itemValue="#{t}" ></f:selectItems>
                            </p:selectOneMenu>

                            <p:outputLabel value="Name" for="name" styleClass="cm-form-label" />
                            <p:inputText 
                                autocomplete="off" 
                                id="name" 
                                value="#{webUserController.loggedUser.person.name}"
                                title="Name" 
                                styleClass="cm-form-field" />



                            <p:outputLabel value="#{bundleClinical.EditWebUserLabel_email}" for="email" styleClass="cm-form-label" />
                            <p:inputText id="email" value="#{webUserController.loggedUser.email}" title="#{bundleClinical.EditWebUserTitle_email}" styleClass="cm-form-field" />

                            <p:outputLabel value="#{bundleClinical.EditWebUserLabel_telNo}" for="telNo" styleClass="cm-form-label" />
                            <p:inputText id="telNo" value="#{webUserController.loggedUser.telNo}" title="#{bundleClinical.EditWebUserTitle_telNo}" styleClass="cm-form-field" />



                        </p:panelGrid>


                    </h:form>
                </p:panel>

            </ui:define>
        </ui:composition>

    </body>
</html>
