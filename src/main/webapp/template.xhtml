<?xml version='1.0' encoding='UTF-8' ?> 
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ez="http://xmlns.jcp.org/jsf/composite/ezcomp">

    <h:head id="headt">
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1"/>
        <link href="https://fonts.googleapis.com/css?family=Poppins;display=swap" rel="stylesheet"></link>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous"/>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.2/font/bootstrap-icons.css"></link>
        <title>#{bundle.Title}</title>
        <ui:insert name="head">
        </ui:insert>
        <h:outputStylesheet library="css" name="tem1.css"/>
        <script type="text/javascript">
            function applyTheme() {
                const theme = localStorage.getItem('theme') || 'light';
                const icon = document.getElementById('themeIcon');
                if (theme === 'dark') {
                    document.documentElement.classList.add('dark-mode');
                    document.body.classList.add('dark-mode');
                    if (icon) {
                        icon.classList.remove('bi-moon-fill');
                        icon.classList.add('bi-sun-fill');
                    }
                } else {
                    document.documentElement.classList.remove('dark-mode');
                    document.body.classList.remove('dark-mode');
                    if (icon) {
                        icon.classList.remove('bi-sun-fill');
                        icon.classList.add('bi-moon-fill');
                    }
                }
            }

            function toggleDarkMode() {
                const icon = document.getElementById('themeIcon');
                if (icon) {
                    icon.classList.add('theme-spin-anim');
                    icon.addEventListener('animationend', function handler() {
                        icon.classList.remove('theme-spin-anim');
                        icon.removeEventListener('animationend', handler);
                    });
                }
                if (document.documentElement.classList.contains('dark-mode')) {
                    localStorage.setItem('theme', 'light');
                } else {
                    localStorage.setItem('theme', 'dark');
                }
                applyTheme();
            }

            // Apply theme immediately
            (function() {
                const theme = localStorage.getItem('theme') || 'light';
                if (theme === 'dark') {
                    document.documentElement.classList.add('dark-mode');
                }
            })();
            
            document.addEventListener('DOMContentLoaded', applyTheme);
        </script>
    </h:head>

    <h:body class="m-0 p-0">
        <ui:insert name="free">
        </ui:insert>

        <p:growl />

        <h:panelGroup layout="block" styleClass="chims-page-wrap" rendered="#{webUserController.logged}">
            <!-- Top header + nav (inside admin_menu component) -->
            <ez:menu/>

            <!-- Page content -->
            <div class="chims-content container-fluid px-3 pt-3 pb-5">
                <ui:insert name="content">
                    Contents
                </ui:insert>
            </div>

            <!-- Footer pinned to bottom -->
            <ui:insert name="bottom">
                <ez:footer/>
            </ui:insert>
        </h:panelGroup>

        <h:panelGroup rendered="#{not webUserController.logged}">
            <ez:login/>
            <ui:insert name="timeout">
            </ui:insert>
        </h:panelGroup>

        <!-- Global floating theme toggle — always visible -->
        <button type="button" onclick="toggleDarkMode()"
                class="chims-theme-fab" title="Toggle dark / light mode">
            <i id="themeIcon" class="bi bi-moon-fill" />
        </button>

    </h:body>

</html>
