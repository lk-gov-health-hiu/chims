<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://java.sun.com/jsf/facelets"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

    <body>

        <ui:composition template="/template.xhtml">

            <ui:define name="content" >
                <p:panel id="WebUserEditDlg" header="Add New User" styleClass="cm-form-panel">
                    <f:facet name="header" >
                        <p:outputLabel value="Add New User" ></p:outputLabel>
                        <h:form>
                            <p:commandButton value="Back" action="index" ajax="false" style="float: right;" >
                            </p:commandButton>
                        </h:form>
                    </f:facet>
                    <h:form id="WebUserEditForm">

                        <p:panelGrid columns="4" rendered="#{webUserController.selected != null}"
                                     styleClass="cm-form-grid"
                                     style="margin: auto; text-align: left; width: 100%;">
                            <f:facet name="header" >
                                <p:commandButton action="#{webUserController.saveNewWebUserByInsAdmin()}" value="#{bundleClinical.Save}" />
                                <p:commandButton value="Back"
                                                 action="index"
                                                 ajax="false"
                                                 class="m-1"
                                                 immediate="true">
                                </p:commandButton>
                            </f:facet>

                            <p:outputLabel value="Title" for="title" styleClass="cm-form-label"/>
                            <p:selectOneMenu id="title" value="#{webUserController.selected.person.title}" styleClass="cm-form-field">
                                <f:selectItems value="#{itemController.titles}" var="t" itemLabel="#{t.name}"
                                               itemValue="#{t}" ></f:selectItems>
                            </p:selectOneMenu>
                            <p:outputLabel value="Name" for="name" styleClass="cm-form-label"/>
                            <p:inputText
                                autocomplete="off"
                                id="name"
                                required="true"
                                styleClass="cm-form-field"
                                value="#{webUserController.selected.person.name}"
                                title="Name" />

                            <p:outputLabel value="Username" for="username" styleClass="cm-form-label"/>
                            <p:inputText id="username" value="#{webUserController.selected.name}"
                                         title="#{bundleClinical.EditWebUserTitle_name}"
                                         styleClass="cm-form-field"
                                         required="true" autocomplete="false"
                                         requiredMessage="#{bundleClinical.EditWebUserRequiredMessage_name}">
                                <f:ajax execute="@this" render="lblune" event="blur" ></f:ajax>
                            </p:inputText>
                            <p:outputLabel value="Email" for="email" styleClass="cm-form-label"/>
                            <p:inputText id="email" value="#{webUserController.selected.email}"
                                         styleClass="cm-form-field"
                                         title="#{bundleClinical.EditWebUserTitle_email}"
                                         autocomplete="false"/>

                            <p:outputLabel id="lblune"
                                           styleClass="cm-form-span4"
                                           value="#{webUserController.userNameExsists()?'Username is already taken. Please try another.':''}" ></p:outputLabel>

                            <p:outputLabel value="Password" for="password" styleClass="cm-form-label"/>
                            <p:password id="password" value="#{webUserController.password}" title="Password"
                                        styleClass="cm-form-field"
                                        autocomplete="false"
                                        required="true" requiredMessage="Password is required."/>
                            <p:outputLabel value="Re-enter Password" for="passwordReenter" styleClass="cm-form-label"/>
                            <p:password id="passwordReenter" value="#{webUserController.passwordReenter}" title="Re-enter Password"
                                        styleClass="cm-form-field"
                                        required="true"
                                        autocomplete="false"
                                        requiredMessage="Password is required."/>

                            <p:outputLabel value="Institution / Unit / Ward" for="institution" styleClass="cm-form-label"/>
                            <p:selectOneMenu id="institution" value="#{webUserController.selected.institution}" styleClass="cm-form-field" required="true">
                                <f:selectItem itemLabel="Please Select" ></f:selectItem>
                                <f:selectItems value="#{webUserController.loggableInstitutions}"
                                               var="ins"
                                               itemLabel="#{ins.name}"
                                               itemValue="#{ins}" ></f:selectItems>
                            </p:selectOneMenu>
                            <p:outputLabel value="Area" for="area" styleClass="cm-form-label"/>
                            <p:autoComplete id="area" value="#{webUserController.selected.area}"
                                            completeMethod="#{areaController.completeAreas}"
                                            var="i" itemLabel="#{i.name}" itemValue="#{i}"
                                            styleClass="cm-form-field"
                                            minQueryLength="2" maxResults="30"
                                            forceSelection="true" required="true">
                                <p:column headerText="Name">
                                    <p:outputLabel value="#{i.name}"></p:outputLabel>
                                </p:column>
                                <p:column headerText="Parent">
                                    <p:outputLabel value="#{i.parentArea.name}"></p:outputLabel>
                                </p:column>
                                <p:column headerText="Type">
                                    <p:outputLabel value="#{i.type}"></p:outputLabel>
                                </p:column>
                            </p:autoComplete >

                            <p:outputLabel value="Telephone Number" for="telNo" styleClass="cm-form-label"/>
                            <p:inputText id="telNo" value="#{webUserController.selected.telNo}"
                                         styleClass="cm-form-field"
                                         autocomplete="false"
                                         title="#{bundleClinical.EditWebUserTitle_telNo}" />
                            <p:outputLabel value="Role" for="webUserRole" styleClass="cm-form-label"/>
                            <p:selectOneMenu id="webUserRole" value="#{webUserController.selected.webUserRole}"
                                             styleClass="cm-form-field"
                                             required="true">
                                <f:selectItem itemLabel="Select" ></f:selectItem>
                                <f:selectItems value="#{webUserController.webUserRolesForInsAdmin}"
                                               var="r"
                                               itemLabel="#{r.label}"
                                               itemValue="#{r}" >
                                </f:selectItems>
                            </p:selectOneMenu>

                        </p:panelGrid>


                    </h:form>
                </p:panel>

            </ui:define>
        </ui:composition>

    </body>
</html>
